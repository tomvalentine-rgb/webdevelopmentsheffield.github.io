<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <title>Redirecting…</title>
    <link rel="canonical" href="https://webdevelopmentsheffield.co.uk/blog/">
    <script>
        (function () {
            var slug = new URLSearchParams(location.search).get('slug');
            location.replace(slug ? '/blog/' + encodeURIComponent(slug) + '/' : '/blog/');
        })();
    </script>
</head>
<body>
    <p>Redirecting to the article… <a id="continue" href="/blog/">Continue</a></p>
    <script>
        (function () {
            var slug = new URLSearchParams(location.search).get('slug');
            document.getElementById('continue').href = slug ? '/blog/' + encodeURIComponent(slug) + '/' : '/blog/';
        })();
    </script>
</body>
</html>
